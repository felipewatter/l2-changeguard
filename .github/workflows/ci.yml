name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install --no-deps -e .
      - name: Compile Python modules
        run: python -m compileall -q src tests
      - name: Run unit and regression tests
        run: python -m unittest discover -s tests -v
      - name: Candidate audit (expected pass)
        run: python -m l2_changeguard audit --candidate examples/baseline.json --policy examples/policy.json --fail-on high
      - name: Change audit (expected block)
        shell: python
        run: |
          import subprocess
          import sys
          command = [sys.executable, '-m', 'l2_changeguard', 'compare', '--baseline', 'examples/baseline.json', '--candidate', 'examples/candidate-risky.json', '--policy', 'examples/policy.json', '--fail-on', 'high']
          status = subprocess.run(command, check=False).returncode
          if status != 2:
              raise SystemExit(f'expected gated exit code 2, got {status}')
